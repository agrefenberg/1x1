<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Flammen-Einmaleins 11 bis 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow column like a campfire scene at night — flames + medals on top, the game board in the middle, trophy shelf at the bottom. Deliberately single dark theme. */
:root {
  --night: #131a2f;
  --night-2: #1c2542;
  --night-3: #253056;
  --line: #34406a;
  --ink: #f5eee2;
  --muted: #a3abc6;
  --ember: #ff7a2f;
  --core: #ffd24a;
  --ok: #5ed49b;
  --bad: #ff5d72;
  --bronze: #cd7f3e;
  --silver: #c3ccd8;
  --gold: #f4c542;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #22305a 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
}
.app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 4px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 5vw, 2rem); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--ember); }
.chip { align-self: flex-start; font-family: var(--display); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--core); background: rgba(255,122,47,.12); border: 1px solid rgba(255,122,47,.35); padding: 3px 10px; border-radius: 99px; }

/* Flames */
.flames { display: flex; gap: 6px; align-items: flex-end; }
.flame { position: relative; width: 40px; height: 74px; }
.flame svg { width: 100%; height: 100%; overflow: visible; transform-origin: 50% 100%; animation: flicker 1.6s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255,140,40,.55)); transition: filter .5s; }
.flame:nth-child(2) svg { animation-delay: -.5s; animation-duration: 1.9s; }
.flame:nth-child(3) svg { animation-delay: -1.1s; animation-duration: 1.4s; }
.flame .outer { fill: url(#gOuter); transition: fill .5s, opacity .5s; }
.flame .inner { fill: url(#gInner); transition: opacity .4s; }
.flame.out svg { animation: none; filter: none; transform: scale(.82); transition: transform .5s, filter .5s; }
.flame.out .outer { fill: var(--line); }
.flame.out .inner { opacity: 0; }
.flame { padding-bottom: 18px; }
.flame .cnt { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-family: var(--display); font-size: .75rem; font-weight: 600; color: var(--core); font-variant-numeric: tabular-nums; }
.flame.grow svg { animation: none; transform: scale(calc(.45 + .55 * var(--p, 0))); filter: drop-shadow(0 0 6px rgba(255,140,40,.35)); transition: transform .35s; }
.flame.grow .outer { opacity: calc(.5 + .5 * var(--p, 0)); }
.flame.lit-now svg { animation: lightup .6s ease-out, flicker 1.6s ease-in-out .6s infinite; }
@keyframes lightup { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.gap { flex: none; width: 8px; }
.flame .smoke { position: absolute; left: 50%; top: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: rgba(200,205,225,.5); opacity: 0; pointer-events: none; }
.flame.dying .smoke { animation: smoke 1.1s ease-out forwards; }
@keyframes flicker {
  0%, 100% { transform: scaleY(1) skewX(0deg); }
  25% { transform: scaleY(1.06) skewX(-2deg); }
  50% { transform: scaleY(.96) skewX(2deg); }
  75% { transform: scaleY(1.04) skewX(-1deg); }
}
@keyframes smoke { 0% { opacity: .7; transform: translateY(0) scale(.6); } 100% { opacity: 0; transform: translateY(-36px) scale(2.2); } }

/* Progress track */
.track { display: flex; align-items: center; gap: 4px; }
.cell { flex: 1; height: 10px; border-radius: 99px; background: var(--night-3); transition: background .3s, box-shadow .3s; }
.cell.on { background: linear-gradient(90deg, var(--ember), var(--core)); box-shadow: 0 0 8px rgba(255,150,50,.5); }
.mark { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: .7rem; font-weight: 600; color: var(--muted); border: 2px dashed var(--line); font-variant-numeric: tabular-nums; }
.medal-bronze { background: radial-gradient(circle at 35% 30%, #f5c49b, var(--bronze) 55%, #8a4d22); }
.medal-silver { background: radial-gradient(circle at 35% 30%, #ffffff, var(--silver) 55%, #7d8899); }
.medal-gold { background: radial-gradient(circle at 35% 30%, #fff3b8, var(--gold) 55%, #a87b0e); }
.mark.got { border: none; color: rgba(20,20,30,.75); }
.track-label { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.track-label b { color: var(--ink); }

/* Board */
.board { background: var(--night-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.hint { margin: 0; color: var(--muted); font-size: .95rem; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col-h { font-family: var(--display); font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.tile {
  font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 5vw, 1.7rem); font-variant-numeric: tabular-nums;
  color: var(--ink); background: var(--night-3); border: 2px solid transparent; border-radius: 14px;
  padding: 14px 8px; cursor: pointer; transition: transform .12s, border-color .15s, background .2s, opacity .3s;
}
@media (hover: hover) { .tile:hover { transform: translateY(-2px); border-color: var(--line); } }
.tile:focus-visible, .key:focus-visible, .btn:focus-visible { outline: 3px solid var(--core); outline-offset: 2px; }
.tile.sel { border-color: var(--ember); background: #3a2f45; box-shadow: 0 0 0 4px rgba(255,122,47,.18); }
.tile.done { background: rgba(94,212,155,.14); border-color: rgba(94,212,155,.5); color: var(--ok); cursor: default; transform: none; opacity: .7; }
.tile.wrong { border-color: var(--bad); animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }

.msg { min-height: 1.4em; margin: 0; font-weight: 600; text-align: center; }
.msg.ok { color: var(--ok); }
.msg.bad { color: var(--bad); }

/* Level 2 */
.q { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; font-family: var(--display); font-weight: 600; font-size: clamp(2.2rem, 10vw, 3.4rem); font-variant-numeric: tabular-nums; padding-block: 10px; }
.q .eq { color: var(--muted); }
.answer { min-width: 3.2ch; padding: 2px 14px; border-radius: 14px; background: var(--night); border: 2px solid var(--line); text-align: center; color: var(--core); }
.answer.empty { color: var(--line); }
.answer.ok { border-color: var(--ok); color: var(--ok); }
.answer.bad { border-color: var(--bad); color: var(--bad); animation: shake .4s; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 340px; width: 100%; margin: 0 auto; }
.key { font-family: var(--display); font-weight: 600; font-size: 1.5rem; padding: 12px 0; border-radius: 14px; border: none; background: var(--night-3); color: var(--ink); cursor: pointer; transition: transform .1s, background .15s; }
.key:active { transform: scale(.95); }
.key.go { background: linear-gradient(180deg, var(--core), var(--ember)); color: #2a1406; }
.key.del { color: var(--muted); }

/* Shelf */
.shelf { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.shelf-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; }
.shelf-row .mark { width: 30px; height: 30px; }

/* Medal pop + overlay */
.pop { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5; }
.pop.show { animation: pop 1.7s ease-out forwards; }
.pop .big { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 0 40px rgba(255,210,74,.5); }
.pop .txt { font-family: var(--display); font-weight: 700; font-size: 1.6rem; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 18% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } 30% { transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-60%) scale(1); } }

.overlay { position: fixed; inset: 0; background: rgba(8,11,22,.78); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { background: var(--night-2); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.dialog h2 { font-family: var(--display); margin: 0; font-size: 1.7rem; text-wrap: balance; }
.dialog p { margin: 0; color: var(--muted); line-height: 1.5; }
.dialog .big { width: 84px; height: 84px; border-radius: 50%; }
.dialog .dead { display: flex; gap: 6px; }
.btn { font-family: var(--display); font-weight: 600; font-size: 1.1rem; border: none; border-radius: 99px; padding: 12px 26px; cursor: pointer; background: linear-gradient(180deg, var(--core), var(--ember)); color: #2a1406; }

/* Touch: kein Markieren, kein Doppeltipp-Zoom, kein Lupen-Menü */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.reset { align-self: center; background: none; border: 1px solid var(--line); color: var(--muted); font-family: var(--body); font-size: .85rem; border-radius: 99px; padding: 8px 18px; cursor: pointer; }
.reset.armed { border-color: var(--bad); color: var(--bad); }
/* Tablet: größere Kacheln und Tasten */
@media (min-width: 700px) {
  .app { max-width: 860px; }
  .tile { font-size: 2rem; padding: 18px 10px; }
  .pad { max-width: 440px; gap: 12px; }
  .key { font-size: 1.9rem; padding: 16px 0; }
}
/* Querformat mit wenig Höhe: alles etwas kompakter */
@media (orientation: landscape) and (max-height: 860px) {
  .app { padding-block: 10px 20px; gap: 12px; }
  h1 { font-size: 1.5rem; }
  .board { padding: 14px 18px; gap: 10px; }
  .hint { font-size: .85rem; }
  .cols { gap: 12px; }
  .col { gap: 8px; }
  .tile { padding: 11px 10px; font-size: 1.7rem; }
  .q { padding-block: 0; font-size: 2.6rem; }
  .pad { grid-template-columns: repeat(6, 1fr); max-width: 640px; gap: 10px; }
  .key { padding: 13px 0; font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) {
  .flame svg, .tile.wrong, .answer.bad { animation: none !important; }
  .pop.show { animation-duration: .01s; opacity: 1; }
}
@media (max-width: 420px) {
  .flame { width: 32px; height: 63px; }
  .board { padding: 14px; }
}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4d1f"/>
      <stop offset=".6" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="gInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Flammen-<span>Einmaleins</span></h1>
      <span class="chip" id="chip">Level 1 · Zuordnen</span>
      <span class="hint" style="font-size:.85rem">Alle Aufgaben von 11 · 11 bis 25 · 25</span>
    </div>
    <div class="flames" id="flames" role="img" aria-label="Noch keine Flamme brennt"></div>
  </header>

  <section aria-label="Fortschritt">
    <div class="track" id="track"></div>
    <div class="track-label" style="margin-top:8px"><span id="countLine"></span><span id="next"></span></div>
  </section>

  <main class="board" id="board"></main>

  <section class="shelf" id="shelf" aria-label="Medaillen"></section>
  <button class="reset" id="reset">Spiel zurücksetzen</button>
</div>

<div class="pop" id="pop" aria-hidden="true"><div class="big"></div><div class="txt"></div></div>
<div id="overlayHost"></div>

<script>
(() => {
  const MAX = 3, PER = 10, ORDER = ['bronze', 'silver', 'gold'];
  const MEDAL_AT = { 5: 'bronze', 10: 'silver', 15: 'gold' };
  const NAME = { bronze: 'Bronze', silver: 'Silber', gold: 'Gold' };
  const FLAME_SVG = '<svg viewBox="0 0 40 56" aria-hidden="true"><path class="outer" d="M20 2C24 12 36 20 36 36C36 47 29 54 20 54C11 54 4 47 4 36C4 27 9 21 12 14C13 20 16 23 18 23C17 15 18 8 20 2Z"/><path class="inner" d="M20 22C23 29 28 33 28 41C28 47 24 51 20 51C16 51 12 47 12 41C12 36 15 33 17 29C18 32 19 33 20 33C19 29 19 26 20 22Z"/></svg><span class="smoke"></span><span class="cnt"></span>';

  const $ = id => document.getElementById(id);
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = ri(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  let S, busy = false, celebrating = false, msgTimer;

  const fresh = () => ({ level: 1, lit: 0, prog: 0, shelf: { 1: [], 2: [] }, round: null, task: null, input: '', overlay: null, msg: '', msgKind: '' });

  // Alle Aufgaben von 11·11 bis 25·25, die letzten 6 Aufgaben werden nicht wiederholt
  const recent = [];
  function makeTask() {
    let a, b, key;
    do { a = ri(11, 25); b = ri(11, 25); key = Math.min(a, b) + 'x' + Math.max(a, b); } while (recent.includes(key));
    recent.push(key); if (recent.length > 6) recent.shift();
    return { a, b, p: a * b };
  }
  function makeRound() {
    const tasks = [], seen = new Set();
    while (tasks.length < 4) { const t = makeTask(); if (!seen.has(t.p)) { seen.add(t.p); tasks.push({ ...t, id: tasks.length, done: false }); } }
    const results = shuffle(tasks.map(t => ({ p: t.p, done: false })));
    return { tasks, results, selT: null, selR: null };
  }

  /* ---------- Spielstand im Browser speichern ---------- */
  const STORE = 'flammen-11-25-v1';
  function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try { const d = JSON.parse(localStorage.getItem(STORE)); return d && d.lit != null && d.shelf ? d : null; } catch (e) { return null; }
  }
  function normalize() {
    S.msg = ''; S.msgKind = '';
    if (S.lit >= MAX) { S.lit = 0; S.prog = 0; }
    if (!S.overlay && S.shelf[S.level].includes('gold')) S.overlay = S.level === 1 ? 'l1done' : 'win';
    if (S.level === 1 && (!S.round || S.round.tasks.every(x => x.done))) S.round = makeRound();
    if (S.level === 1) { S.round.selT = null; S.round.selR = null; }
    if (S.level === 2 && !S.task) S.task = makeTask();
  }

  /* ---------- static parts ---------- */
  function buildFlames() {
    $('flames').innerHTML = Array.from({ length: MAX }, () => '<div class="flame">' + FLAME_SVG + '</div>').join('');
  }
  function renderFlames(dyingIndex, litIndex) {
    [...$('flames').children].forEach((f, i) => {
      const lit = i < S.lit, growing = i === S.lit && S.prog > 0;
      f.classList.toggle('out', !lit && !growing);
      f.classList.toggle('grow', growing);
      f.style.setProperty('--p', growing ? S.prog / PER : 1);
      f.querySelector('.cnt').textContent = growing ? S.prog + '/' + PER : (lit ? '10/10' : '');
      f.classList.remove('lit-now');
      if (i === litIndex) { void f.offsetWidth; f.classList.add('lit-now'); }
      if (i === dyingIndex) { f.classList.remove('dying'); void f.offsetWidth; f.classList.add('dying'); }
    });
    $('flames').setAttribute('aria-label', S.lit === 0 ? 'Noch keine Flamme brennt' : S.lit === 1 ? '1 Flamme brennt' : S.lit + ' Flammen brennen');
  }
  function nextMedal() { return ORDER[Math.min(S.shelf[S.level].length, 2)]; }
  function renderTrack() {
    save();
    const done = S.lit * PER + S.prog, total = MAX * PER, m = nextMedal();
    let html = '';
    for (let i = 0; i < total; i++) {
      if (i && i % PER === 0) html += '<div class="gap"></div>';
      html += '<div class="cell' + (i < done ? ' on' : '') + '"></div>';
    }
    html += '<div class="gap"></div><div class="mark got medal-' + m + '" style="opacity:' + (done >= total ? 1 : .4) + '" title="' + NAME[m] + '"></div>';
    $('track').innerHTML = html;
    $('countLine').innerHTML = '<b>' + S.lit + '</b> von 3 Flammen · <b>' + S.prog + '</b> von 10 für die nächste';
    $('next').textContent = 'Noch ' + (total - done) + ' richtige bis ' + NAME[m];
  }
  function renderShelf() {
    const row = lvl => {
      const got = S.shelf[lvl];
      return '<div class="shelf-row">Level ' + lvl + ' ' + ['bronze', 'silver', 'gold'].map((m, i) =>
        '<div class="mark' + (got.includes(m) ? ' got medal-' + m : '') + '" title="' + NAME[m] + '">' + (got.includes(m) ? '' : ['B', 'S', 'G'][i]) + '</div>').join('') + '</div>';
    };
    $('shelf').innerHTML = row(1) + row(2);
  }
  function renderChip() { $('chip').textContent = S.level === 1 ? 'Level 1 · Zuordnen' : 'Level 2 · Selbst rechnen'; }

  function setMsg(text, kind, ms) {
    S.msg = text; S.msgKind = kind || '';
    const el = $('msg'); if (el) { el.textContent = text; el.className = 'msg ' + S.msgKind; }
    clearTimeout(msgTimer);
    if (ms) msgTimer = setTimeout(() => setMsg('', ''), ms);
  }

  /* ---------- board ---------- */
  function renderBoard() {
    save();
    if (S.level === 1) renderLevel1(); else renderLevel2();
  }
  function renderLevel1() {
    const r = S.round;
    $('board').innerHTML =
      '<p class="hint">Tippe eine Aufgabe und dann das passende Ergebnis an. Mit 10 richtigen zündest du eine Flamme an, 3 Flammen bringen eine Medaille. Ein Fehler löscht die letzte Flamme.</p>' +
      '<div class="cols"><div class="col"><div class="col-h">Aufgabe</div>' +
      r.tasks.map((t, i) => '<button class="tile' + (t.done ? ' done' : '') + (r.selT === i ? ' sel' : '') + '" data-side="t" data-i="' + i + '"' + (t.done ? ' disabled' : '') + '>' + t.a + ' · ' + t.b + '</button>').join('') +
      '</div><div class="col"><div class="col-h">Ergebnis</div>' +
      r.results.map((x, i) => '<button class="tile' + (x.done ? ' done' : '') + (r.selR === i ? ' sel' : '') + '" data-side="r" data-i="' + i + '"' + (x.done ? ' disabled' : '') + '>' + x.p + '</button>').join('') +
      '</div></div><p class="msg ' + S.msgKind + '" id="msg" aria-live="polite">' + S.msg + '</p>';
  }
  function renderLevel2() {
    const t = S.task;
    $('board').innerHTML =
      '<p class="hint">Rechne selbst und tippe das Ergebnis ein, dann OK oder Enter. 10 richtige zünden eine Flamme an, ein Fehler löscht die letzte.</p>' +
      '<div class="q"><span>' + t.a + ' · ' + t.b + '</span><span class="eq">=</span><span class="answer' + (S.input ? '' : ' empty') + '" id="answer">' + (S.input || '?') + '</span></div>' +
      '<p class="msg ' + S.msgKind + '" id="msg" aria-live="polite">' + S.msg + '</p>' +
      '<div class="pad">' + [1,2,3,4,5,6,7,8,9].map(n => '<button class="key" data-k="' + n + '">' + n + '</button>').join('') +
      '<button class="key del" data-k="del" aria-label="Löschen">⌫</button><button class="key" data-k="0">0</button><button class="key go" data-k="ok">OK</button></div>';
  }
  function updateAnswer(cls) {
    const el = $('answer'); if (!el) return;
    el.textContent = S.input || '?';
    el.className = 'answer' + (S.input ? '' : ' empty') + (cls ? ' ' + cls : '');
  }

  /* ---------- game logic ---------- */
  function hit() {
    S.prog++;
    if (S.prog < PER) { renderFlames(-1); renderTrack(); return; }
    S.prog = 0; S.lit++;
    renderFlames(-1, S.lit - 1); renderTrack();
    if (S.lit < MAX) { setMsg('Flamme ' + S.lit + ' brennt!', 'ok', 1600); return; }
    const m = nextMedal();
    S.shelf[S.level].push(m);
    renderShelf();
    if (m === 'gold') { busy = true; setTimeout(() => showOverlay(S.level === 1 ? 'l1done' : 'win'), 900); return; }
    popMedal(m);
    celebrating = true;
    setTimeout(() => {
      celebrating = false;
      S.lit = 0; S.prog = 0;
      if (S.level === 1 && S.round.tasks.every(x => x.done)) { S.round = makeRound(); busy = false; }
      renderFlames(-1); renderTrack(); renderBoard();
    }, 1700);
  }
  function miss() {
    let dying = -1, text;
    if (S.lit > 0) { S.lit--; dying = S.lit; text = 'Eine Flamme ist erloschen.'; }
    else { if (S.prog > 0) dying = 0; text = 'Die Flamme fängt wieder bei 0 an.'; }
    S.prog = 0;
    renderFlames(dying); renderTrack();
    return text;
  }
  function popMedal(m) {
    const p = $('pop');
    p.querySelector('.big').className = 'big medal-' + m;
    p.querySelector('.txt').textContent = NAME[m] + '-Medaille!';
    p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
  }

  function pick(side, i) {
    if (busy || celebrating || S.overlay) return;
    const r = S.round;
    const item = side === 't' ? r.tasks[i] : r.results[i];
    if (item.done) return;
    if (side === 't') r.selT = r.selT === i ? null : i; else r.selR = r.selR === i ? null : i;
    if (r.selT == null || r.selR == null) { renderBoard(); return; }
    const t = r.tasks[r.selT], res = r.results[r.selR];
    if (t.p === res.p) {
      t.done = res.done = true; r.selT = r.selR = null;
      setMsg('Richtig! ' + t.a + ' · ' + t.b + ' = ' + t.p, 'ok', 1600);
      renderBoard();
      hit();
      if (r.tasks.every(x => x.done) && !busy && !celebrating) {
        busy = true;
        setTimeout(() => { busy = false; if (!S.overlay) { S.round = makeRound(); renderBoard(); } }, 550);
      }
    } else {
      const ti = r.selT, rj = r.selR; r.selT = r.selR = null;
      renderBoard();
      document.querySelector('[data-side="t"][data-i="' + ti + '"]').classList.add('wrong');
      document.querySelector('[data-side="r"][data-i="' + rj + '"]').classList.add('wrong');
      setMsg(t.a + ' · ' + t.b + ' ist nicht ' + res.p + '. ' + miss(), 'bad', 2400);
    }
  }

  function key(k) {
    if (busy || celebrating || S.overlay || S.level !== 2) return;
    if (k === 'del') { S.input = S.input.slice(0, -1); updateAnswer(); return; }
    if (k === 'ok') { submit(); return; }
    if (S.input.length >= 3) return;
    if (S.input === '' && k === '0') return;
    S.input += k; updateAnswer();
  }
  function submit() {
    if (!S.input) { setMsg('Tippe zuerst eine Zahl ein.', '', 1500); return; }
    const t = S.task, v = Number(S.input);
    busy = true;
    if (v === t.p) {
      updateAnswer('ok');
      setMsg('Richtig!', 'ok');
      hit();
      setTimeout(() => { if (!S.overlay) { busy = false; nextTask(); } }, 650);
    } else {
      updateAnswer('bad');
      setMsg('Leider nicht. ' + t.a + ' · ' + t.b + ' = ' + t.p + '. ' + miss(), 'bad');
      setTimeout(() => { if (!S.overlay) { busy = false; nextTask(); } }, 1800);
    }
  }
  function nextTask() { S.task = makeTask(); S.input = ''; setMsg('', ''); renderBoard(); }

  /* ---------- overlays ---------- */
  function showOverlay(type) {
    S.overlay = type;
    renderOverlay();
  }
  function renderOverlay() {
    save();
    const host = $('overlayHost');
    if (!S.overlay) { host.innerHTML = ''; return; }
    let inner;
    if (S.overlay === 'l1done') inner = '<div class="big medal-gold"></div><h2 id="dlgT">Gold in Level 1!</h2><p>Du hast Bronze, Silber und Gold gesammelt. In Level 2 tippst du die Ergebnisse selbst ein. Die Flammen fangen wieder bei 0 an.</p><button class="btn" data-act="level2">Weiter zu Level 2</button>';
    else if (S.overlay === 'win') inner = '<div class="big medal-gold"></div><h2 id="dlgT">Zweimal Gold!</h2><p>Du hast beide Level geschafft und alle Aufgaben von 11 · 11 bis 25 · 25 voll im Griff.</p><button class="btn" data-act="restart">Nochmal spielen</button>';
    else inner = '<div class="dead">' + Array.from({ length: MAX }, () => '<div class="flame out">' + FLAME_SVG + '</div>').join('') + '</div><h2 id="dlgT">Alle Flammen sind aus</h2><p>Jetzt geht alles von vorne los: Level 1, neue Flammen, neue Medaillen. Du schaffst das!</p><button class="btn" data-act="restart">Neu anzünden</button>';
    host.innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="dialog">' + inner + '</div></div>';
    const btn = host.querySelector('.btn'); if (btn) btn.focus();
  }
  function act(a) {
    if (a === 'level2') {
      S.level = 2; S.lit = 0; S.prog = 0; S.overlay = null; S.input = ''; S.task = makeTask(); setMsg('', '');
    } else {
      S = fresh(); S.round = makeRound();
    }
    busy = false; celebrating = false;
    renderAll();
  }

  function renderAll() {
    renderChip(); renderFlames(-1); renderTrack(); renderShelf(); renderBoard(); renderOverlay();
  }

  /* ---------- events ---------- */
  let resetTimer;
  document.addEventListener('click', e => {
    const rb = e.target.closest('#reset');
    if (rb) {
      if (rb.classList.contains('armed')) { clearTimeout(resetTimer); rb.classList.remove('armed'); rb.textContent = 'Spiel zurücksetzen'; act('restart'); }
      else { rb.classList.add('armed'); rb.textContent = 'Wirklich alles löschen? Nochmal tippen'; resetTimer = setTimeout(() => { rb.classList.remove('armed'); rb.textContent = 'Spiel zurücksetzen'; }, 3000); }
      return;
    }
    const tile = e.target.closest('.tile'); if (tile) { pick(tile.dataset.side, Number(tile.dataset.i)); return; }
    const k = e.target.closest('.key'); if (k) { key(k.dataset.k); return; }
    const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act);
  });
  document.addEventListener('keydown', e => {
    if (S.overlay) return;
    if (S.level !== 2) return;
    if (/^[0-9]$/.test(e.key)) { key(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { key('del'); e.preventDefault(); }
    else if (e.key === 'Enter') { key('ok'); e.preventDefault(); }
  });

  function start(data) {
    S = data && data.S && (d => d.lit != null && d.shelf)(data.S) ? data.S : (load() || fresh());
    normalize();
    busy = false;
    buildFlames();
    renderAll();
    window.claude?.hot?.snapshot?.(() => ({ S }));
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
